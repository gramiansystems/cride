name: Bug report
description: Report a reproducible problem in cride
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.

  - type: input
    id: version
    attributes:
      label: cride version
      description: Paste the output of `cride --version` or the commit SHA.
      placeholder: cride v0.1.0 or abc1234
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your OS, terminal, shell, and Git version.
      placeholder: Linux; WezTerm; bash; Git 2.51
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest repository setup and key sequence that reproduces the problem.
      placeholder: |
        1. Start cride with ...
        2. Press ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, terminal captures, or a minimal repository link. Remove secrets and private source first.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and private source from the report.
          required: true
